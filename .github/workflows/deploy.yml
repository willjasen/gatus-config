name: Deploy Gatus configuration

on:
  push:
    branches:
      - main
    paths:
      - config.yaml
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-gatus
  cancel-in-progress: false

jobs:
  validate-gatus-configuration:
    name: Validate Gatus configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out configuration
        uses: actions/checkout@v4

      - name: Run Gatus configuration validation
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/gatus-data"
          output_file="$RUNNER_TEMP/gatus-validation.log"
          set +e
          timeout --signal=TERM --kill-after=5s 20s \
            docker run --rm --network none \
            -v "$PWD/config.yaml:/config/config.yaml:ro" \
            -v "$RUNNER_TEMP/gatus-data:/opt/gatus/data" \
            twinproduction/gatus:stable >"$output_file" 2>&1
          status=$?
          set -e

          cat "$output_file"
          {
            echo "## Gatus configuration validation"
            echo
            if [ "$status" -eq 124 ]; then
              echo "✅ Gatus loaded the configuration and remained running for the 20-second validation window."
            else
              echo "❌ Gatus exited before the validation timeout with status \`$status\`."
            fi
            echo
            echo "<details><summary>Gatus output (last 40 lines)</summary>"
            echo
            echo '```text'
            tail -n 40 "$output_file"
            echo '```'
            echo
            echo "</details>"
          } >>"$GITHUB_STEP_SUMMARY"

          if [ "$status" -ne 124 ]; then
            echo "Gatus exited before the validation timeout with status $status."
            exit "$status"
          fi

  deploy-gatus-configuration:
    name: Deploy Gatus configuration
    needs: validate-gatus-configuration
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Deploy Gatus configuration
        env:
          GATUS_HOST: ${{ secrets.GATUS_HOST }}
          GATUS_USER: ${{ secrets.GATUS_USER }}
          GATUS_DISCORD_WEBHOOK_URL: ${{ secrets.GATUS_DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          test -n "$GATUS_HOST"
          test -n "$GATUS_USER"
          test -n "$GATUS_DISCORD_WEBHOOK_URL"

          tailscale ssh "$GATUS_USER@$GATUS_HOST" bash -se <<REMOTE
          set -euo pipefail

          git -C /opt/gatus-config pull --ff-only --quiet
          install -m 0644 /opt/gatus-config/config.yaml /opt/gatus/config/config.yaml
          sudo install -d /etc/systemd/system/gatus.service.d
          sudo sh -c 'printf "%s\n" "[Service]" "Environment=\"GATUS_DISCORD_WEBHOOK_URL=${GATUS_DISCORD_WEBHOOK_URL}\"" > /etc/systemd/system/gatus.service.d/discord-webhook.conf'
          sudo systemctl daemon-reload
          sudo systemctl restart gatus
          REMOTE

          echo "Gatus configuration deployed successfully."
