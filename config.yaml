      - "[STATUS] == 200"

  - name: levitate
    group: Websites
    url: "https://levitate.willjasen.com/"
    interval: 5m
    conditions:
      - "[STATUS] == 200"

  - name: nerdhirn
    group: Websites
    url: "https://nerdhirn.tech/"
    interval: 5m
    conditions:
      - "[STATUS] == 200"

  - name: tailmox
    group: Websites
    url: "https://tailmox.com/"
